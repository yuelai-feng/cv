name: Build CV
on:
  push:
    paths: ["cv.tex", ".github/workflows/build-cv.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git diff --staged --quiet || git commit -m "Auto-build CV PDF [skip ci]"
          git push
